# Red Card – nginx site for redcard.batudev.com
# Install:  /etc/nginx/sites-available/redcard.batudev.com.conf  (+ symlink in sites-enabled)
# HTTPS is added afterwards by:  certbot --nginx -d redcard.batudev.com

# At most 10 report requests per minute from one address (extra burst of 20).
limit_req_zone $binary_remote_addr zone=redcard_reports:1m rate=10r/m;

server {
    listen 80;
    server_name redcard.batudev.com;

    root /var/www/redcard.batudev.com/public;
    index index.html;

    # Privacy: no access log for this site, so no IP addresses are kept.
    access_log off;

    # Apple fetches this to allow the report extension to post here.
    # It must be served as JSON, without redirects.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /rules.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /privacy {
        try_files /privacy.html =404;
    }

    location /api/ {
        limit_req zone=redcard_reports burst=20 nodelay;
        client_max_body_size 64k;

        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
