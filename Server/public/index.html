<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Card</title>
<style>
  :root { --text: #1c1c1e; --muted: #6c6c70; --bg: #f2f2f7; --accent: #c8102e; }
  @media (prefers-color-scheme: dark) {
    :root { --text: #f2f2f7; --muted: #a1a1a6; --bg: #000; --accent: #e3202f; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  main { max-width: 520px; padding: 48px 16px; }
  .card { width: 72px; height: 103px; border-radius: 8px; transform: rotate(-8deg); margin-bottom: 32px;
          background: var(--accent); box-shadow: inset 0 -6px 0 rgb(0 0 0 / .22), 0 10px 24px rgb(0 0 0 / .22); }
  h1 { font-size: 34px; line-height: 1.15; margin: 0 0 12px; font-stretch: expanded; }
  p { margin: 0 0 16px; color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="card" aria-hidden="true"></div>
  <h1>Red Card</h1>
  <p>Bahis ve casino SMS'lerini iPhone'unda İstenmeyen klasörüne taşıyan ücretsiz uygulama. Her şey telefonunda çalışır.</p>
  <p>A free iPhone app that moves betting and casino texts to Spam, entirely on your phone.</p>
  <p><a href="/privacy">Gizlilik politikası / Privacy policy</a></p>
</main>
</body>
</html>
